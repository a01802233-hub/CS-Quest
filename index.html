<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS Quest</title>
<style>
  :root{
    --green:#58cc02; --green-d:#58a700; --green-bg:#d7ffb8; --green-t:#58a700;
    --red:#ff4b4b; --red-d:#ea2b2b; --red-bg:#ffdfe0; --red-t:#ea2b2b;
    --blue:#1cb0f6; --blue-d:#1899d6; --blue-bg:#ddf4ff;
    --gold:#ffc800; --gold-d:#e5b400;
    --ink:#4b4b4b; --muted:#afafaf; --line:#e5e5e5; --bg:#fff; --card:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Nunito","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
       color:var(--ink);background:var(--bg);font-weight:700;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-weight:800;cursor:pointer}
  .hidden{display:none!important}

  /* ---------- top stats bar (home) ---------- */
  .topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--line);
          display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
  .logo{font-size:24px;font-weight:900;color:var(--green)}
  .stats{display:flex;gap:16px;font-weight:900}
  .stat.fire{color:#ff9600}.stat.xp{color:var(--gold-d)}

  /* ---------- home / path ---------- */
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
  .unit{margin-bottom:34px}
  .unit-head{border-radius:16px;padding:16px 18px;color:#fff;margin-bottom:22px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .unit-head small{opacity:.85;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .unit-head h2{margin:2px 0 0;font-size:22px}
  .path{display:flex;flex-direction:column;align-items:center;gap:20px}
  .node{width:78px;height:70px;border-radius:50%;border:0;color:#fff;font-size:28px;position:relative;
        box-shadow:0 7px 0 var(--sd);background:var(--c);transition:transform .08s,box-shadow .08s}
  .node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sd)}
  .node .lbl{position:absolute;top:80px;left:50%;transform:translateX(-50%);white-space:nowrap;
             font-size:13px;color:var(--ink);font-weight:800}
  .node.done{--c:var(--gold);--sd:var(--gold-d)}
  .node.u0{--c:var(--green);--sd:var(--green-d)}
  .node.u1{--c:var(--blue);--sd:var(--blue-d)}
  .node.u2{--c:#ce82ff;--sd:#a568cc}
  .node.u3{--c:#ff9600;--sd:#cc7a00}
  .node.u4{--c:#ff5c8a;--sd:#d1456e}
  .path .node{margin-bottom:20px}
  .unit-head.u0{background:var(--green)}.unit-head.u1{background:var(--blue)}.unit-head.u2{background:#ce82ff}
  .unit-head.u3{background:#ff9600}.unit-head.u4{background:#ff5c8a}

  /* ---------- lesson ---------- */
  #lesson{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column}
  .lbar{display:flex;align-items:center;gap:14px;max-width:760px;width:100%;margin:0 auto;padding:18px 16px}
  .x{background:none;border:0;font-size:26px;color:var(--muted);padding:0 4px}
  .prog{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
  .prog>div{height:100%;width:0;background:var(--green);border-radius:10px;transition:width .35s;position:relative}
  .prog>div::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;background:rgba(255,255,255,.35);border-radius:4px}
  .hearts{color:var(--red);font-weight:900;font-size:18px;min-width:48px;text-align:right}
  .lmain{flex:1;overflow:auto;max-width:640px;width:100%;margin:0 auto;padding:10px 20px 190px}
  .instr{font-size:26px;font-weight:900;margin:12px 0 22px;color:#3c3c3c}
  .qcard{font-size:20px;line-height:1.5;white-space:pre-line;margin-bottom:22px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-bottom:12px;
       background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;font-size:18px;color:var(--ink)}
  .opt:hover{background:#f7f7f7}
  .opt .k{border:2px solid var(--line);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:14px;color:var(--muted);flex:none}
  .opt.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-d)}
  .opt.sel .k{border-color:var(--blue);color:var(--blue)}
  .opt.right{border-color:var(--green);background:var(--green-bg);color:var(--green-t)}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red-t)}
  .txt{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:#f7f7f7;color:var(--ink);outline:none}
  .txt:focus{border-color:var(--blue);background:#fff}
  .txt.right{border-color:var(--green);background:var(--green-bg);color:var(--green-t)}
  .txt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red-t)}
  .sentence{font-size:22px;line-height:2.4}
  .sentence .txt{display:inline-block;width:auto;min-width:130px;padding:6px 12px;font-size:20px;text-align:center;margin:0 4px}

  .foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:#fff}
  .foot .in{max-width:760px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}
  .foot.right{background:var(--green-bg);border-color:var(--green-bg)}
  .foot.wrong{background:var(--red-bg);border-color:var(--red-bg)}
  .fb{flex:1;min-width:0}
  .fb h3{margin:0 0 6px;font-size:24px;font-weight:900}
  .foot.right h3{color:var(--green-t)}.foot.wrong h3{color:var(--red-t)}
  .fb .ans{font-size:16px;margin-bottom:6px;color:var(--red-t)}
  .fb .exp{font-size:15px;line-height:1.45;white-space:pre-line;max-height:34vh;overflow:auto;font-weight:700}
  .foot.right .exp{color:var(--green-t)}.foot.wrong .exp{color:#c33}
  .exp b{display:block;text-transform:uppercase;font-size:12px;letter-spacing:.6px;opacity:.8;margin-bottom:2px}
  .btn{border:0;border-radius:14px;padding:14px 30px;font-size:17px;text-transform:uppercase;letter-spacing:.8px;
       color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);min-width:150px;flex:none}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
  .btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed;transform:none}
  .foot.wrong .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
  .btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
  .btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

  /* ---------- result ---------- */
  .result{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .result .big{font-size:76px}
  .result h1{margin:0;font-size:32px;color:var(--gold-d)}
  .result.fail h1{color:var(--red)}
  .cards{display:flex;gap:12px;margin:10px 0 22px}
  .rc{border:2px solid;border-radius:14px;min-width:120px;overflow:hidden}
  .rc .t{color:#fff;font-size:12px;letter-spacing:.8px;padding:5px;text-transform:uppercase}
  .rc .v{padding:14px;font-size:24px;font-weight:900}
  .rc.xp{border-color:var(--gold)}.rc.xp .t{background:var(--gold)}.rc.xp .v{color:var(--gold-d)}
  .rc.ac{border-color:var(--green)}.rc.ac .t{background:var(--green)}.rc.ac .v{color:var(--green-t)}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .shake{animation:shake .4s}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .3s}
  @media(max-width:520px){.instr{font-size:22px}.fb h3{font-size:20px}.btn{padding:13px 18px;min-width:110px}}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="topbar">
    <div class="logo">CS Quest</div>
    <div class="stats"><span class="stat fire" title="Day streak">🔥 <span id="streak">0</span></span>
      <span class="stat xp" title="Total XP">⚡ <span id="xp">0</span> XP</span></div>
  </div>
  <div class="wrap" id="units"></div>
</div>

<!-- LESSON -->
<div id="lesson" class="hidden">
  <div class="lbar">
    <button class="x" id="quit" aria-label="Quit lesson">✕</button>
    <div class="prog"><div id="bar"></div></div>
    <div class="hearts">❤️ <span id="hearts">5</span></div>
  </div>
  <div class="lmain"><div id="instr" class="instr"></div><div id="qbody"></div></div>
  <div class="foot" id="foot"><div class="in">
    <div class="fb" id="fb"></div>
    <button class="btn" id="go" disabled>Check</button>
  </div></div>
</div>

<!-- RESULT -->
<div id="result" class="result hidden"></div>

<script>
const $ = s => document.querySelector(s);
const HEARTS = 5, XP_PER_Q = 10;
let lessons = [], S = null;

/* ---------- progress (localStorage) ---------- */
function load(){ try { return JSON.parse(localStorage.getItem("csquest")) || {}; } catch(e){ return {}; } }
function save(p){ try { localStorage.setItem("csquest", JSON.stringify(p)); } catch(e){} }
function today(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(p){
  const t = today();
  if (p.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0,10);
  p.streak = (p.last === y ? (p.streak||0) : 0) + 1;
  p.last = t;
}

/* ---------- home ---------- */
async function showHome(){
  $("#lesson").classList.add("hidden"); $("#result").classList.add("hidden"); $("#home").classList.remove("hidden");
  if (!lessons.length) lessons = await (await fetch("/api/lessons")).json();
  const p = load(); p.done = p.done || {};
  $("#xp").textContent = p.xp || 0;
  $("#streak").textContent = (p.last === today() || p.last === new Date(Date.now()-864e5).toISOString().slice(0,10)) ? (p.streak||0) : 0;
  const box = $("#units"); box.innerHTML = "";
  const units = [...new Set(lessons.map(l => l.section))];
  units.forEach(u => {
    const ls = lessons.filter(l => l.section === u);
    const el = document.createElement("div"); el.className = "unit";
    el.innerHTML = `<div class="unit-head u${u}"><small>Unit ${u+1}</small><h2>${ls[0].unit}</h2></div><div class="path"></div>`;
    const path = el.querySelector(".path");
    ls.forEach((l, i) => {
      const b = document.createElement("button");
      const done = p.done[l.id] != null;
      b.className = "node u" + u + (done ? " done" : "");
      b.style.transform = `translateX(${[0,46,0,-46][i%4]}px)`;
      b.innerHTML = (done ? "★" : "▶") + `<span class="lbl">${l.title.replace(l.unit,"").trim() ? "Part " + l.title.replace(l.unit,"").trim() : "Start"}${done ? " · " + p.done[l.id] + "%" : ""}</span>`;
      b.onclick = () => startLesson(l.id);
      path.appendChild(b);
    });
    box.appendChild(el);
  });
}

/* ---------- lesson ---------- */
async function startLesson(id){
  const data = await (await fetch("/api/lessons/" + id)).json();
  S = { id, title:data.title, queue:data.questions.slice(), total:data.questions.length, correct:0, wrongCount:0,
        hearts:HEARTS, checked:false, current:null, answer:null };
  $("#home").classList.add("hidden"); $("#result").classList.add("hidden"); $("#lesson").classList.remove("hidden");
  next();
}

function setProgress(){ $("#bar").style.width = (S.correct / S.total * 100) + "%"; $("#hearts").textContent = S.hearts; }

function next(){
  if (S.hearts <= 0) return finish(false);
  if (!S.queue.length) return finish(true);
  setProgress();
  const q = S.queue[0]; S.current = q; S.checked = false; S.answer = null;
  const foot = $("#foot"); foot.className = "foot"; $("#fb").innerHTML = "";
  const go = $("#go"); go.textContent = "Check"; go.disabled = true;
  $("#instr").textContent = q.instruction;
  const body = $("#qbody"); body.innerHTML = "";
  body.classList.remove("pop"); void body.offsetWidth; body.classList.add("pop");

  if (q.type === "choice"){
    const c = document.createElement("div"); c.className = "qcard"; c.textContent = q.prompt; body.appendChild(c);
    q.options.forEach((o, i) => {
      const b = document.createElement("button"); b.className = "opt";
      b.innerHTML = `<span class="k">${i+1}</span><span></span>`; b.lastChild.textContent = o;
      b.onclick = () => { if (S.checked) return; body.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
                          b.classList.add("sel"); S.answer = o; go.disabled = false; };
      body.appendChild(b);
    });
  } else if (q.type === "text"){
    const c = document.createElement("div"); c.className = "qcard"; c.textContent = q.prompt; body.appendChild(c);
    const inp = document.createElement("input"); inp.className = "txt"; inp.placeholder = q.placeholder;
    inp.autocomplete = "off"; inp.spellcheck = false;
    inp.oninput = () => { S.answer = inp.value; go.disabled = !inp.value.trim(); };
    body.appendChild(inp); inp.focus();
  } else {
    const d = document.createElement("div"); d.className = "sentence";
    q.parts.forEach((t, i) => {
      d.appendChild(document.createTextNode(t));
      if (i < q.parts.length - 1){
        const inp = document.createElement("input"); inp.className = "txt"; inp.autocomplete = "off"; inp.spellcheck = false;
        inp.oninput = () => { S.answer = [...d.querySelectorAll("input")].map(x => x.value);
                              go.disabled = S.answer.some(v => !v.trim()); };
        d.appendChild(inp);
      }
    });
    body.appendChild(d); d.querySelector("input").focus();
  }
}

async function check(){
  const q = S.current; S.checked = true;
  $("#go").disabled = true;
  let r;
  try {
    r = await (await fetch("/api/check", { method:"POST", headers:{"Content-Type":"application/json"},
               body: JSON.stringify({ id:q.id, answer:S.answer }) })).json();
  } catch(e){ S.checked = false; $("#go").disabled = false; alert("Could not reach the server."); return; }

  const body = $("#qbody");
  body.querySelectorAll("input").forEach(i => { i.disabled = true; i.classList.add(r.correct ? "right" : "wrong"); });
  body.querySelectorAll(".opt").forEach(o => {
    o.disabled = true;
    const txt = o.lastChild.textContent;
    if (o.classList.contains("sel")) o.classList.add(r.correct ? "right" : "wrong");
    if (!r.correct && txt === r.answer) o.classList.add("right");
  });

  const foot = $("#foot"); foot.className = "foot " + (r.correct ? "right" : "wrong");
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const title = r.correct ? pick(["Correct!","Nice work!","Great job!","Spot on!","You got it!"])
                          : pick(["Not quite","Incorrect","Almost there","Oops!"]);
  $("#fb").innerHTML = `<h3>${r.correct ? "✓ " : "✗ "}${title}</h3>` +
    (r.correct ? "" : `<div class="ans"><b>Correct answer:</b> <span id="ca"></span></div>`) +
    `<div class="exp"><b>Explanation</b><span id="ex"></span></div>`;
  if (!r.correct) $("#ca").textContent = r.answer;
  $("#ex").textContent = r.explanation;

  S.queue.shift();
  if (r.correct){ S.correct++; }
  else { S.hearts--; S.wrongCount++; S.queue.push(q); body.classList.remove("shake"); void body.offsetWidth; body.classList.add("shake"); }
  setProgress();
  const go = $("#go"); go.disabled = false; go.textContent = "Continue"; go.focus();
}

$("#go").onclick = () => S.checked ? next() : check();
$("#quit").onclick = () => { if (confirm("Quit this lesson? Your progress in it will be lost.")) showHome(); };
document.addEventListener("keydown", e => {
  if ($("#lesson").classList.contains("hidden")) return;
  if (e.key === "Enter" && !$("#go").disabled){ e.preventDefault(); $("#go").click(); }
  if (!S.checked && S.current && S.current.type === "choice" && /^[1-9]$/.test(e.key)){
    const o = $("#qbody").querySelectorAll(".opt")[+e.key - 1]; if (o) o.click();
  }
});

/* ---------- results ---------- */
function finish(win){
  $("#lesson").classList.add("hidden");
  const attempts = S.total + S.wrongCount;
  const acc = Math.round(S.total / attempts * 100);
  const xp = win ? S.total * XP_PER_Q + (S.wrongCount === 0 ? 10 : 0) : 0;
  if (win){
    const p = load(); p.done = p.done || {};
    p.xp = (p.xp || 0) + xp; bumpStreak(p);
    p.done[S.id] = Math.max(p.done[S.id] || 0, acc); save(p);
  }
  const r = $("#result"); r.className = "result" + (win ? "" : " fail");
  r.innerHTML = win
    ? `<div class="big">🏆</div><h1>Lesson complete!</h1>
       <div class="cards"><div class="rc xp"><div class="t">Total XP</div><div class="v">⚡ ${xp}</div></div>
       <div class="rc ac"><div class="t">Accuracy</div><div class="v">🎯 ${acc}%</div></div></div>
       <div class="row"><button class="btn ghost" id="again">Practice again</button><button class="btn" id="cont">Continue</button></div>`
    : `<div class="big">💔</div><h1>Out of hearts!</h1><p>Review the explanations and give it another go.</p>
       <div class="row"><button class="btn blue" id="again">Try again</button><button class="btn ghost" id="cont">Back to path</button></div>`;
  r.classList.remove("hidden");
  $("#again").onclick = () => startLesson(S.id);
  $("#cont").onclick = showHome;
}

showHome();
</script>
</body>
</html>
